services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: apps/dashboard
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_CONTROL_API_KEY: ${TRADING_CONTROL_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
