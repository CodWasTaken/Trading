[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform"
version = "0.23.0"
description = "Risk-first AI-assisted paper trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "websockets>=13,<16",
]

[project.scripts]
trading-research = "trading_app.cli:main"
trading-news = "trading_app.news_cli:main"
trading-holdout = "trading_app.holdout_cli:main"
trading-registry = "trading_app.registry_cli:main"
trading-monitor = "trading_app.monitoring_cli:main"
trading-smoke = "trading_app.smoke_cli:main"
trading-candidates = "trading_app.candidates_cli:main"
trading-graduation = "trading_app.graduation_cli:main"
trading-models = "trading_app.model_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]
models-tabular = [
  "lightgbm>=4.5,<5",
  "xgboost>=2.1,<4",
  "catboost>=1.2,<2",
  "scikit-learn>=1.6,<2",
]
models-sequence = [
  "torch>=2.4,<3",
]
models = [
  "lightgbm>=4.5,<5",
  "xgboost>=2.1,<4",
  "catboost>=1.2,<2",
  "scikit-learn>=1.6,<2",
  "torch>=2.4,<3",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["trading_app"]
mypy_path = "apps/api"
